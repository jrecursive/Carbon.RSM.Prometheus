global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rust_server_metrics
    metrics_path: /metrics
    sample_limit: 20000
    label_limit: 40

    static_configs:
      - targets:
          - 127.0.0.1:9108
        labels:
          server: us-main-1

    # Alternative discovery using file_sd:
    # file_sd_configs:
    #   - files:
    #       - /etc/prometheus/file_sd/rust_servers.json

    metric_relabel_configs:
      - action: labeldrop
        regex: '^(steamid|ip)$'
